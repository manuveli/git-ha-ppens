commit:
  name: Commit
  description: Create a git commit of the current configuration changes.
  fields:
    message:
      name: Commit message
      description: Custom commit message. If empty, an auto-generated message will be used.
      required: false
      example: "Updated automations for new lights"
      selector:
        text:

push:
  name: Push
  description: Push committed changes to the configured remote repository.

pull:
  name: Pull
  description: Pull changes from the configured remote repository. Uncommitted changes will be auto-saved as a backup commit before pulling.

fetch:
  name: Fetch
  description: Fetch new commits from the remote repository without merging. Updates the behind/ahead commit counts.

discard_changes:
  name: Discard local changes
  description: Permanently discard staged and unstaged changes to tracked files. Untracked files are preserved.

sync:
  name: Sync
  description: Commit all changes and push to the remote repository in one step.
  fields:
    message:
      name: Commit message
      description: Custom commit message. If empty, an auto-generated message will be used.
      required: false
      example: "Weekly config sync"
      selector:
        text:

diff:
  name: Diff
  description: Get the current git diff of uncommitted changes. Returns response data with the diff content and a status summary.

encrypt_secrets:
  name: Encrypt secrets
  description: Manually encrypt local secrets.yaml files to their encrypted .enc.yaml counterparts using SOPS and age.
  fields:
    files:
      name: Files
      description: Optional list of secret file paths to encrypt. If omitted, all detected secrets are encrypted.
      required: false
      example: ["secrets.yaml"]
      selector:
        object:

decrypt_secrets:
  name: Decrypt secrets
  description: Manually decrypt tracked .enc.yaml secrets files to plain secrets.yaml using SOPS and your configured age key.
  fields:
    files:
      name: Files
      description: Optional list of encrypted secret file paths to decrypt. If omitted, all detected secrets are decrypted.
      required: false
      example: ["secrets.enc.yaml"]
      selector:
        object:
